name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VISUALR_REPO: ${{ vars.VISUALR_REPO || 'https://github.com/lkh-cq/visualR.git' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up R + pkgload (for R-equivalence gates)
        run: |
          sudo apt-get update
          # r-base-dev: C build headers; libuv1-dev: processx needs uv.h
          # (pkgload dependency chain) — prior failures were silent compile errors
          sudo apt-get install -y --no-install-recommends r-base r-base-dev libuv1-dev libcurl4-openssl-dev libssl-dev
          sudo Rscript -e 'install.packages("pkgload", repos="https://cloud.r-project.org")'
          # explicit verification — the equivalence gates fail hard if this breaks
          Rscript -e 'stopifnot(requireNamespace("pkgload", quietly=TRUE))'

      - name: Checkout visualR reference package
        run: |
          git clone --depth 1 "$VISUALR_REPO" /tmp/visualR
          echo "visualR_R_PACKAGE=/tmp/visualR/visualR" >> "$GITHUB_ENV"

      - name: Maven build + tests
        run: mvn -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
